# ---------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------
title: Radio Sky Journal
author: Grace Brazil
description: >-
  A working log of radio astronomy experiments, from public telescope
  data to eventually my own small-dish observations.

url: "https://gracebrazil28.github.io"   # your account's Pages address
baseurl: "/radioskyjournal"              # the repository name, because this is a project site
repo_url: "https://github.com/gracebrazil28/radioskyjournal"

# ---------------------------------------------------------------
# Build settings (GitHub Pages supports everything below)
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
permalink: /log/:year/:month/:title/

plugins:
  - jekyll-feed        # RSS feed at /feed.xml, so people can subscribe
  - jekyll-seo-tag     # page titles and link previews

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "projects"
    values:
      layout: default   # project READMEs carry their own headings

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
